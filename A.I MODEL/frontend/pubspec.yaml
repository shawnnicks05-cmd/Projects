name: ai_model_frontend
description: A Flutter frontend for the AI Model project.
publish_to: "none"
version: 0.1.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0
  http: ^1.1.0
  flutter_dotenv: ^5.1.0
  google_fonts: ^6.1.0
  animations: ^2.0.11
  file_picker: ^8.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
flutter:
  uses-material-design: true
  assets:
    - assets/icon/bot_icon.png
    - .env

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/bot_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/bot_icon.png"
